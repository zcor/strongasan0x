name: CI

# Keep this hosted check deliberately small. Local exact-SHA validation is the
# fallback when Actions is unavailable; see README.md. GitHub Actions spending
# is permanently $0; do not add push or scheduled triggers.
on: [pull_request]

jobs:
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Conventional Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            commit_range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            commit_range="$HEAD_SHA"
          else
            commit_range="$PUSH_BEFORE..$HEAD_SHA"
          fi

          invalid="$(git log --format='%h %s' "$commit_range" | grep -vE '^[0-9a-f]+ (build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+' || true)"
          if [ -n "$invalid" ]; then
            echo "::error::Commit messages must follow Conventional Commits (for example: fix: correct dashboard layout)."
            echo "$invalid"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .
      # Guard: Django {# #} comments are SINGLE-LINE only. A multi-line one is
      # NOT stripped and leaks as visible text on the page (shipped twice —
      # never again). Fail if any template opens {# without closing #} on the
      # same line.
      - name: No multi-line Django template comments
        run: |
          if grep -rnE '\{#' --include='*.html' . | grep -vE '#\}'; then
            echo "::error::Multi-line {# #} Django comment found — it renders as visible text. Make it single-line or use {% comment %}.";
            exit 1;
          fi
