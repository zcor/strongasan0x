<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>{% block title %}Daily Check-In{% endblock %}</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e8eaed;
            padding: 16px;
            padding-bottom: 48px;
        }
        .wrap {
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.4rem;
            margin: 8px 0 4px;
            color: #ffd97a;
        }
        .date {
            color: #9aa3b2;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .flash {
            background: rgba(135, 206, 235, 0.12);
            border: 1px solid rgba(135, 206, 235, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
        .flash.success { background: rgba(120, 200, 120, 0.12); border-color: rgba(120, 200, 120, 0.35); }
        .suggestion {
            background: rgba(255, 217, 122, 0.08);
            border: 1px solid rgba(255, 217, 122, 0.3);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 22px;
        }
        .suggestion-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffd97a;
            margin-bottom: 6px;
        }
        .suggestion-text {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .suggestion-actions {
            display: flex;
            gap: 10px;
        }
        .suggestion-actions button {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e8eaed;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .suggestion-actions button.primary {
            background: rgba(255, 217, 122, 0.2);
            border-color: rgba(255, 217, 122, 0.5);
            color: #ffd97a;
        }
        .question {
            margin-bottom: 12px;
        }
        .question input[type="checkbox"] {
            display: none;
        }
        .question label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 18px 18px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .question label:active {
            transform: scale(0.98);
        }
        .question input[type="checkbox"]:checked + label {
            background: rgba(120, 200, 120, 0.18);
            border-color: rgba(120, 200, 120, 0.55);
            color: #c8f0c8;
        }
        .check-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: transparent;
        }
        .question input[type="checkbox"]:checked + label .check-icon {
            background: #78c878;
            border-color: #78c878;
            color: #14391a;
        }
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #e8eaed;
            resize: vertical;
            min-height: 80px;
            margin-top: 8px;
        }
        textarea:focus {
            outline: none;
            border-color: rgba(255, 217, 122, 0.5);
        }
        .comment-label {
            display: block;
            color: #9aa3b2;
            font-size: 0.85rem;
            margin-top: 20px;
        }
        .submit {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ffd97a 0%, #f5b942 100%);
            color: #1a1a2e;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            border-radius: 14px;
            padding: 18px;
            margin-top: 24px;
            cursor: pointer;
        }
        .submit:active { transform: scale(0.98); }
        .footer {
            margin-top: 28px;
            text-align: center;
            color: #6c7483;
            font-size: 0.8rem;
        }
        .footer .name { color: #9aa3b2; }
    </style>
</head>
<body>
    <div class="wrap">
        {% if messages %}
            {% for message in messages %}
                <div class="flash {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
