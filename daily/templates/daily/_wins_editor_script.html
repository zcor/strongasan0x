{% include "daily/_elist_toggle_script.html" %}
<script>
(function () {
    "use strict";
    function initWinsEditor(root) {
    if (!root || root.dataset.winsInitialized === "1") return;
    root.dataset.winsInitialized = "1";
    var archivedPanel = document.getElementById("wins-dialog-archived");
    var archivedHost = archivedPanel && archivedPanel.querySelector("[data-wins-archived-host]");
    var archivedLoading = archivedPanel && archivedPanel.querySelector("[data-wins-archived-loading]");
    var archivedLink = root.querySelector("[data-wins-archived]");
    var archivedLoaded = false;
    var archivedRequestPending = false;
    var archivedReloadQueued = false;
    var CSRF = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";
    var $ = function (id) { return root.querySelector("#" + id); };
    try { var token = "{{ self_token }}"; if (token) localStorage.setItem("daily_self_token", token); } catch (e) {}

    function post(url, body, onOk, onErr) {
        fetch(url, {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
            body: JSON.stringify(body || {}),
        }).then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (res) { if (res.d && res.d.ok) { onOk && onOk(res.d); } else { onErr && onErr(res); } })
          .catch(function () { onErr && onErr({ status: 0 }); });
    }

    function syncToday(data) {
        if (window.__syncWinsEditorResult) window.__syncWinsEditorResult(data || {});
    }

    function editToast(msg, host) {
        var toast = document.createElement("div");
        toast.className = "edit-toast";
        toast.textContent = "🌟 " + msg;
        (host || root).appendChild(toast);
        requestAnimationFrame(function () { toast.classList.add("show"); });
        setTimeout(function () {
            toast.classList.remove("show");
            setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
        }, 3200);
    }

    function goalCount(goalEl) {
        var count = goalEl.querySelectorAll('.stone[data-status="open"]').length;
        var label = goalEl.querySelector("[data-count]");
        if (label) label.textContent = count + " left";
    }

    function syncEmpty() {
        var list = $("wins-list");
        var empty = $("wins-empty");
        var hasItems = list.children.length > 0;
        list.classList.toggle("has-items", hasItems);
        if (empty) empty.classList.toggle("is-hidden", hasItems);
    }

    // North stars sit above one-off wins in the shared list.
    function insertGoal(el) {
        var list = $("wins-list");
        var firstSingle = list.querySelector(".single");
        if (firstSingle) list.insertBefore(el, firstSingle);
        else list.appendChild(el);
    }

    function stoneEl(stone) {
        var row = document.createElement("div");
        row.className = "stone" + (stone.done ? " done" : "");
        row.dataset.stoneId = stone.id;
        row.dataset.status = stone.status || "open";
        if (stone.done) {
            row.innerHTML = '<span class="dot" aria-hidden="true"></span><span class="rlabel"></span>'
                + (stone.status === "done" ? '<button class="stone-undo" type="button" data-uncheck-step="' + stone.id + '" aria-label="Uncheck step">Uncheck</button>' : '');
        } else {
            row.innerHTML = '<span class="dot" aria-hidden="true"></span><span class="rlabel"></span><button class="sremove" type="button" data-remove="' + stone.id + '" aria-label="Remove step">✕</button>';
        }
        row.querySelector(".rlabel").textContent = stone.text;
        return row;
    }

    function singleEl(single) {
        var row = document.createElement("div");
        row.className = "elist-item single collapsible collapsed";
        row.dataset.stoneId = single.id;
        row.dataset.status = single.status || "open";
        row.innerHTML = '<div class="goalhead elist-heading"><span class="goal-summary elist-label"><span class="gtitle elist-name"></span><input class="composer-input goal-title-input" type="text" data-goal-title-input maxlength="200" aria-label="Win name" autocomplete="off"></span><button class="goal-toggle elist-toggle" type="button" data-toggle-goal aria-expanded="false"><span class="goal-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button></div><div class="goal-details"><div class="goal-actions elist-actions"><button class="danger" type="button" data-remove="' + single.id + '" aria-label="Delete this win">Delete</button><button class="addstone" type="button" data-add-stone="' + single.id + '">Add a step</button><button class="goal-save primary" type="button" data-save-goal="' + single.id + '">Save</button></div></div>';
        row.querySelector(".gtitle").textContent = single.text;
        var titleInput = row.querySelector("[data-goal-title-input]");
        titleInput.value = single.text;
        titleInput.dataset.savedValue = single.text;
        row.querySelector("[data-toggle-goal]").setAttribute("aria-label", "Toggle " + single.text);
        return row;
    }

    function goalEl(goal) {
        var block = document.createElement("div");
        var collapsed = true;
        block.className = "elist-item goal collapsible collapsed";
        block.dataset.goalId = goal.id;
        block.innerHTML = '<div class="goalhead elist-heading"><span class="goal-summary elist-label"><span class="gtitle elist-name"></span><input class="composer-input goal-title-input" type="text" data-goal-title-input maxlength="200" aria-label="Win name" autocomplete="off"><span class="gcount elist-meta" data-count></span></span><button class="goal-toggle elist-toggle" type="button" data-toggle-goal aria-expanded="false"><span class="goal-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button></div><div class="goal-details"><div class="stones elist-body"></div><div class="goal-actions elist-actions"><button class="goal-archive danger" type="button" data-archive-goal="' + goal.id + '" aria-label="Delete this win">Delete</button><button class="addstone" type="button" data-add-stone="' + goal.id + '">Add a step</button><button class="goal-save primary" type="button" data-save-goal="' + goal.id + '">Save</button></div></div>';
        block.querySelector(".gtitle").textContent = goal.text;
        var titleInput = block.querySelector("[data-goal-title-input]");
        titleInput.value = goal.text;
        titleInput.dataset.savedValue = goal.text;
        block.querySelector("[data-toggle-goal]").setAttribute("aria-label", "Toggle " + goal.text);
        (goal.stones || []).forEach(function (stone) { block.querySelector(".stones").appendChild(stoneEl(stone)); });
        goalCount(block);
        return block;
    }

    // Renames a north star or a one-off win; both live behind the same
    // parentless /daily/win/goal/edit/ endpoint.
    function saveGoalTitle(input, save) {
        if (!input || !save || input.dataset.saving === "1") return;
        var saved = input.dataset.savedValue || "";
        var value = input.value.trim();
        var item = input.closest(".elist-item");
        var isGoal = item.classList.contains("goal");
        if (!value) {
            editToast("A win needs a name.");
            return;
        }
        if (value === saved) return;
        input.dataset.saving = "1";
        input.disabled = true;
        save.disabled = true;
        save.textContent = "Saving…";
        post("/daily/win/goal/edit/", { id: item.dataset.goalId || item.dataset.stoneId, text: value }, function (data) {
            var title = data.goal.text;
            input.disabled = false;
            save.disabled = false;
            save.textContent = "Save";
            delete input.dataset.saving;
            input.value = title;
            input.dataset.savedValue = title;
            item.querySelector(".gtitle").textContent = title;
            var toggle = item.querySelector("[data-toggle-goal]");
            var remove = isGoal
                ? item.querySelector("[data-archive-goal]")
                : item.querySelector(".goal-actions [data-remove]");
            if (toggle) toggle.setAttribute("aria-label", "Toggle " + title);
            if (remove) remove.setAttribute("aria-label", "Delete " + title);
            syncToday(data);
            editToast("Win saved.");
        }, function () {
            input.disabled = false;
            save.disabled = false;
            save.textContent = "Save";
            delete input.dataset.saving;
            editToast("Couldn't save that right now.");
        });
    }

    root.addEventListener("click", function (e) {
        var save = e.target.closest("[data-save-goal]");
        if (!save || !root.contains(save)) return;
        saveGoalTitle(save.closest(".elist-item").querySelector("[data-goal-title-input]"), save);
    });

    root.addEventListener("keydown", function (e) {
        if (!e.target.matches("[data-goal-title-input]")) return;
        if (e.key === "Enter") {
            e.preventDefault();
            var save = e.target.closest(".elist-item").querySelector("[data-save-goal]");
            saveGoalTitle(e.target, save);
        }
        else if (e.key === "Escape") {
            e.preventDefault();
            e.target.value = e.target.dataset.savedValue || "";
            e.target.blur();
        }
    });

    function markStoneDone(row, status) {
        if (!row) return;
        var goal = row.closest(".goal");
        var label = row.querySelector(".rlabel");
        row.replaceWith(stoneEl({
            id: row.dataset.stoneId,
            text: label ? label.textContent : "",
            status: status || "done",
            done: true,
        }));
        if (goal) goalCount(goal);
    }

    function markStoneOpen(row, stone) {
        if (!row || !stone) return;
        var goal = row.closest(".goal");
        row.replaceWith(stoneEl(stone));
        if (goal) goalCount(goal);
    }

    window.__syncWinsEditorRows = function (data) {
        data = data || {};
        if (data.north_star_done) {
            var completedGoal = root.querySelector('[data-goal-id="' + data.north_star_done.id + '"]');
            if (completedGoal) completedGoal.remove();
            loadArchived(true);
        }
        if (data.completed) {
            var completedRow = root.querySelector('[data-stone-id="' + data.completed.id + '"]');
            if (completedRow && completedRow.classList.contains("single")) completedRow.remove();
            else markStoneDone(completedRow, data.completed.status);
        }
        if (data.reopened) {
            var reopenedRow = root.querySelector('[data-stone-id="' + data.reopened.id + '"]');
            markStoneOpen(reopenedRow, data.reopened);
        }
        syncEmpty();
    };

    root.addEventListener("click", function (e) {
        var undo = e.target.closest("[data-uncheck-step]");
        if (!undo || !root.contains(undo)) return;
        undo.disabled = true;
        post("/daily/win/", { id: undo.getAttribute("data-uncheck-step"), action: "uncheck" }, function (data) {
            markStoneOpen(undo.closest(".stone"), data.reopened);
            syncToday(data);
        }, function () {
            undo.disabled = false;
            editToast("Couldn't uncheck that step right now.");
        });
    });

    root.addEventListener("click", function (e) {
        var archive = e.target.closest("[data-archive-goal]");
        if (!archive || !root.contains(archive)) return;
        archive.disabled = true;
        post("/daily/win/goal/archive/", { id: archive.getAttribute("data-archive-goal") }, function (data) {
            var goal = archive.closest(".goal"); if (goal) goal.remove();
            syncEmpty(); syncToday(data);
            loadArchived(true);
            editToast("Moved to Archived: " + data.archived.title);
        }, function () {
            archive.disabled = false;
            editToast("Couldn't archive that right now.");
        });
    });

    root.addEventListener("click", function (e) {
        var remove = e.target.closest("[data-remove]");
        if (!remove || !root.contains(remove)) return;
        var id = remove.getAttribute("data-remove");
        post("/daily/win/remove/", { id: id }, function (data) {
            var goal = remove.closest(".goal");
            var row = remove.closest(".stone, .single, .goal");
            if (remove.classList.contains("gremove")) {
                if (goal) goal.remove();
            } else if (row) {
                row.remove();
                if (goal) goalCount(goal);
            }
            syncEmpty();
            syncToday(data);
        });
    });

    root.addEventListener("click", function (e) {
        var button = e.target.closest("[data-add-stone]");
        if (!button || !root.contains(button)) return;
        var goalId = button.getAttribute("data-add-stone");
        var goal = button.closest(".elist-item");
        var existing = goal.querySelector(".stone-composer");
        if (existing) { existing.querySelector("input").focus(); return; }
        var wrap = document.createElement("div"); wrap.className = "stone-composer";
        var body = document.createElement("div"); body.className = "stone-composer-body";
        var input = document.createElement("input"); input.type = "text"; input.maxLength = 200;
        input.className = "composer-input"; input.placeholder = "e.g. Ask Dana for a referral"; input.autocomplete = "off";
        var foot = document.createElement("div"); foot.className = "card-foot";
        var cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "act"; cancel.textContent = "Cancel";
        var add = document.createElement("button"); add.type = "button"; add.className = "act gold"; add.textContent = "Add";
        body.appendChild(input); foot.appendChild(cancel); foot.appendChild(add);
        wrap.appendChild(body); wrap.appendChild(foot);
        var actions = button.closest(".goal-actions");
        actions.parentNode.insertBefore(wrap, actions);
        button.classList.add("is-hidden");
        input.focus();
        var pending = false;
        function close() {
            if (pending) return;
            wrap.remove();
            button.classList.remove("is-hidden");
        }
        function submit() {
            if (pending) return;
            var text = input.value.trim(); if (!text) { input.focus(); return; }
            pending = true; input.disabled = true; cancel.disabled = true; add.disabled = true;
            add.textContent = "Adding…"; add.classList.add("loading");
            post("/daily/win/stone/add/", { goal_id: goalId, text: text }, function (data) {
                pending = false;
                if (data.converted && data.goal) {
                    // The one-off grew into a north star: rebuild the row in
                    // goal form, keep it with the other goals, leave it open.
                    var replacement = goalEl({ id: data.goal.id, text: data.goal.text, stones: [data.stone] });
                    goal.remove();
                    insertGoal(replacement);
                    if (window.elistSetExpanded) window.elistSetExpanded(replacement, true);
                } else {
                    goal.querySelector(".stones").appendChild(stoneEl(data.stone));
                    goalCount(goal); close();
                }
                syncToday(data);
            }, function () {
                pending = false; input.disabled = false; cancel.disabled = false; add.disabled = false;
                add.textContent = "Add"; add.classList.remove("loading");
                editToast("Couldn't add that step right now."); input.focus();
            });
        }
        cancel.onclick = close;
        add.onclick = submit;
        input.onkeydown = function (event) {
            if (event.key === "Enter") { event.preventDefault(); submit(); }
            else if (event.key === "Escape") close();
        };
    });

    // One composer covers both shapes: plain text adds a one-off win, adding
    // steps turns it into a north star (mirrors the habits add composer).
    var composer = $("ncomposer"), goalInput = $("ncomp-goal"),
        stepsSection = $("ncomp-steps-section"), stepsHost = $("ncomp-steps"), message = $("ncomp-msg");
    function openComposer() {
        composer.classList.remove("is-hidden"); goalInput.value = "";
        stepsHost.innerHTML = ""; stepsSection.classList.add("is-hidden");
        message.classList.add("is-hidden"); goalInput.focus();
    }
    function closeComposer() { composer.classList.add("is-hidden"); }
    if ($("add-win-btn")) $("add-win-btn").onclick = openComposer;
    if ($("ncomp-cancel")) $("ncomp-cancel").onclick = closeComposer;
    if (composer) composer.addEventListener("click", function (e) { if (e.target === composer) closeComposer(); });
    if ($("ncomp-more")) $("ncomp-more").onclick = function () {
        stepsSection.classList.remove("is-hidden");
        var input = document.createElement("input"); input.type = "text"; input.maxLength = 200;
        input.className = "composer-input nc-step"; input.autocomplete = "off";
        input.placeholder = stepsHost.children.length
            ? "Next step (optional)"
            : "First step, e.g. Update your resume";
        stepsHost.appendChild(input); input.focus();
    };
    if ($("ncomp-save")) $("ncomp-save").onclick = function () {
        var text = goalInput.value.trim();
        var stones = Array.prototype.slice.call(stepsHost.querySelectorAll(".nc-step")).map(function (step) { return step.value.trim(); }).filter(Boolean);
        if (!text) { message.textContent = "Give your win a name."; message.classList.remove("is-hidden"); goalInput.focus(); return; }
        var save = $("ncomp-save"); save.disabled = true;
        function fail() {
            save.disabled = false; message.textContent = "Couldn't add that, try again."; message.classList.remove("is-hidden");
        }
        if (stones.length) {
            post("/daily/win/goal/add/", { goal: text, stones: stones }, function (data) {
                insertGoal(goalEl(data.goal));
                save.disabled = false; closeComposer(); syncEmpty(); syncToday(data);
            }, fail);
        } else {
            post("/daily/win/add/", { text: text }, function (data) {
                if (data.added) $("wins-list").appendChild(singleEl(data.added));
                save.disabled = false; closeComposer(); syncEmpty(); syncToday(data);
            }, fail);
        }
    };

    {% if not wins_dialog %}
    try { if (new URLSearchParams(location.search).get("add") === "1") openComposer(); } catch (e) {}
    {% endif %}

    function showWinsEditor() {
        root.hidden = false;
        root.setAttribute("aria-hidden", "false");
        if (archivedPanel) {
            archivedPanel.hidden = true;
            archivedPanel.setAttribute("aria-hidden", "true");
        }
        var dialog = root.closest("dialog");
        if (dialog) {
            dialog.setAttribute("aria-labelledby", "wins-dialog-title");
            dialog.scrollTop = 0;
        }
    }

    function showArchivedEditor() {
        if (!archivedPanel) return;
        root.hidden = true;
        root.setAttribute("aria-hidden", "true");
        archivedPanel.hidden = false;
        archivedPanel.setAttribute("aria-hidden", "false");
        var dialog = archivedPanel.closest("dialog");
        if (dialog) {
            dialog.setAttribute("aria-labelledby", "wins-archived-title");
            dialog.scrollTop = 0;
        }
        loadArchived(false);
    }

    function loadArchived(force) {
        if (!archivedPanel || !archivedHost || !archivedLoading || !archivedLink) return;
        if (force) archivedLoaded = false;
        if (archivedRequestPending) {
            if (force) archivedReloadQueued = true;
            return;
        }
        if (archivedLoaded) return;
        archivedRequestPending = true;
        archivedPanel.setAttribute("aria-busy", "true");

        var hasContent = Boolean(archivedHost.querySelector("[data-wins-archived-content]"));
        var error = archivedLoading.querySelector("[data-wins-archived-error]");
        archivedLoading.querySelectorAll(".skeleton-line").forEach(function (line) { line.hidden = false; });
        if (error) error.hidden = true;
        if (!hasContent) {
            archivedLoading.hidden = false;
            archivedHost.hidden = true;
        }

        var url = new URL(archivedLink.href, window.location.href);
        url.searchParams.set("fragment", "1");
        fetch(url.toString(), {
            method: "GET", credentials: "same-origin",
            headers: { "X-Requested-With": "XMLHttpRequest" },
        }).then(function (response) {
            if (!response.ok) throw new Error("archive request failed");
            return response.text();
        }).then(function (html) {
            var probe = document.createElement("template");
            probe.innerHTML = html.trim();
            if (!probe.content.querySelector("[data-wins-archived-content]")) {
                throw new Error("archive fragment missing");
            }
            archivedHost.innerHTML = html;
            archivedHost.hidden = false;
            archivedLoading.hidden = true;
            var loadingTitle = archivedLoading.querySelector("#wins-archived-title");
            if (loadingTitle) loadingTitle.removeAttribute("id");
            archivedLoaded = true;
            archivedRequestPending = false;
            archivedPanel.setAttribute("aria-busy", "false");
            syncRestoreFoots();
            if (archivedReloadQueued) {
                archivedReloadQueued = false;
                loadArchived(true);
            }
        }).catch(function () {
            archivedRequestPending = false;
            archivedReloadQueued = false;
            archivedPanel.setAttribute("aria-busy", "false");
            if (!hasContent) {
                archivedLoading.querySelectorAll(".skeleton-line").forEach(function (line) { line.hidden = true; });
                if (error) error.hidden = false;
            }
        });
    }

    if (archivedLink && archivedPanel) {
        archivedLink.addEventListener("click", function (event) {
            event.preventDefault();
            showArchivedEditor();
        });
        archivedPanel.addEventListener("click", function (event) {
            var back = event.target.closest("[data-archived-back]");
            if (back) {
                event.preventDefault();
                showWinsEditor();
                return;
            }
            var retry = event.target.closest("[data-wins-archived-retry]");
            if (retry) loadArchived(false);
        });
        archivedPanel.addEventListener("change", function (event) {
            if (event.target.closest('input[name="id"]')) syncRestoreFoots();
        });
        archivedPanel.addEventListener("submit", function (event) {
            var form = event.target.closest("[data-restore-list]");
            if (!form || !archivedPanel.contains(form)) return;
            event.preventDefault();
            var checks = Array.prototype.slice.call(form.querySelectorAll('input[name="id"]:checked'));
            if (!checks.length) return;
            var button = form.querySelector('button[type="submit"]');
            if (button) { button.disabled = true; button.textContent = "Moving…"; }
            var moved = [];
            (function next(index) {
                if (index >= checks.length) {
                    var content = archivedPanel.querySelector("[data-wins-archived-content]");
                    var historyEmpty = content && content.querySelector("[data-history-empty]");
                    if (historyEmpty) historyEmpty.classList.toggle("is-hidden", Boolean(content.querySelector("[data-history-goal]")));
                    syncEmpty();
                    syncRestoreFoots();
                    if (moved.length === 1) editToast("Moved to Working Toward: " + moved[0], archivedPanel);
                    else if (moved.length) editToast("Moved " + moved.length + " to Working Toward.", archivedPanel);
                    else editToast("Couldn't move those right now.", archivedPanel);
                    return;
                }
                var box = checks[index];
                var goal = box.closest("[data-history-goal]");
                var title = goal && goal.querySelector(".gtitle");
                post(form.action, { id: box.value }, function (data) {
                    moved.push(title ? title.textContent.trim() : "Win");
                    if (goal) goal.remove();
                    if (data.goal && !root.querySelector('[data-goal-id="' + data.goal.id + '"]')) {
                        insertGoal(goalEl(data.goal));
                    }
                    syncToday(data);
                    next(index + 1);
                }, function () {
                    next(index + 1);
                });
            })(0);
        });
    }

    function syncRestoreFoots() {
        if (!archivedPanel) return;
        Array.prototype.forEach.call(archivedPanel.querySelectorAll("[data-restore-list]"), function (form) {
            var button = form.querySelector('button[type="submit"]');
            var foot = form.querySelector("[data-restore-foot]");
            if (!button || !foot) return;
            var checked = form.querySelectorAll('input[name="id"]:checked').length;
            foot.classList.toggle("is-hidden", !form.querySelector("[data-history-goal]"));
            button.disabled = checked === 0;
            button.textContent = checked > 1
                ? "Move " + checked + " to Working Toward"
                : "Move to Working Toward";
        });
    }
    window.__showWinsEditor = showWinsEditor;

    var close = root.querySelector("[data-wins-close]");
    if (close) close.onclick = function () { if (window.__closeWinsDialog) window.__closeWinsDialog(); };
    var ask = root.querySelector("[data-wins-ask]");
    if (ask) ask.onclick = function () {
        if (window.__closeWinsDialog) window.__closeWinsDialog();
        if (window.__openCoach) window.__openCoach();
    };
    }
    window.__initWinsEditor = initWinsEditor;
    var initialRoot = document.querySelector("[data-wins-editor]");
    if (initialRoot) initWinsEditor(initialRoot);
})();
</script>
